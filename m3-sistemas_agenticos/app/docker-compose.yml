version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend/datos:/app/datos
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/salud"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
